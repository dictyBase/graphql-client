<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 856" width="760" height="856" role="img" aria-label="Shared fp-go command pipeline">
  <title>Shared fp-go command pipeline</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="856" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">
    <text x="22" y="30" text-anchor="start" font-size="16" font-weight="600">Shared fp-go command pipeline</text>
    <text x="22" y="50" text-anchor="start" font-size="12.5" fill="#57606a">Every subcommand runs the same stages. Validation stays pure, the network call stays inside the IOEither.</text>
    <rect x="165" y="80" width="430" height="62" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/>
    <text x="181" y="105" text-anchor="start" font-size="13.5" font-weight="600">CLI flags</text>
    <text x="579" y="105" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#0a3069">urfave/cli/v3</text>
    <text x="181" y="125" text-anchor="start" font-size="12.5" fill="#57606a">Parse the flags of the subcommand</text>
    <path fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)" d="M 380.0 145 L 380.0 165"/>
    <rect x="165" y="168" width="430" height="62" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/>
    <text x="181" y="193" text-anchor="start" font-size="13.5" font-weight="600">Wrap</text>
    <text x="579" y="193" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#0a3069">IOE.Of</text>
    <text x="181" y="213" text-anchor="start" font-size="12.5" fill="#57606a">Put the context and the *cli.Command in an IOEither</text>
    <path fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)" d="M 380.0 233 L 380.0 253"/>
    <rect x="165" y="256" width="430" height="62" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/>
    <text x="181" y="281" text-anchor="start" font-size="13.5" font-weight="600">Validate</text>
    <text x="579" y="281" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#0a3069">IOE.ChainEitherK</text>
    <text x="181" y="301" text-anchor="start" font-size="12.5" fill="#57606a">Pure Either checks. The pipeline stops at the first Left</text>
    <path fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)" d="M 380.0 321 L 380.0 341"/>
    <rect x="165" y="344" width="430" height="62" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/>
    <text x="181" y="369" text-anchor="start" font-size="13.5" font-weight="600">Build state</text>
    <text x="579" y="369" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#0a3069">L.MakeLens setters</text>
    <text x="181" y="389" text-anchor="start" font-size="12.5" fill="#57606a">Set the client, the filter, and the probe set</text>
    <path fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)" d="M 380.0 409 L 380.0 429"/>
    <rect x="165" y="432" width="430" height="62" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/>
    <text x="181" y="457" text-anchor="start" font-size="13.5" font-weight="600">Execute</text>
    <text x="579" y="457" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#0a3069">hasura/go-graphql-client</text>
    <text x="181" y="477" text-anchor="start" font-size="12.5" fill="#57606a">Send the query, the mutation, or the 27 probes</text>
    <path fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)" d="M 380.0 497 L 380.0 517"/>
    <rect x="165" y="520" width="430" height="62" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="6 4"/>
    <text x="181" y="545" text-anchor="start" font-size="13.5" font-weight="600">liveness-check only</text>
    <text x="579" y="545" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#0a3069">IOE.Let + IOE.Chain</text>
    <text x="181" y="565" text-anchor="start" font-size="12.5" fill="#57606a">Aggregate the outcomes into a LivenessReport, then write the file</text>
    <path fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)" d="M 380.0 585 L 380.0 605"/>
    <rect x="165" y="608" width="430" height="62" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/>
    <text x="181" y="633" text-anchor="start" font-size="13.5" font-weight="600">Unwrap</text>
    <text x="579" y="633" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#0a3069">ioeutils.ToEither</text>
    <text x="181" y="653" text-anchor="start" font-size="12.5" fill="#57606a">Run the effect, give back an Either</text>
    <path fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)" d="M 380.0 673 L 380.0 693"/>
    <rect x="280.0" y="696" width="200" height="40" rx="8" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.3"/>
    <text x="380.0" y="721" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#0a3069">E.Fold</text>
    <rect x="34" y="788" width="300" height="44" rx="8" fill="#fff1f0" stroke="#e5534b" stroke-width="1.3"/>
    <text x="184" y="815" text-anchor="middle" font-size="13">Message on stderr, exit status 1</text>
    <rect x="380" y="788" width="346" height="44" rx="8" fill="#f2fbf5" stroke="#4ac26b" stroke-width="1.3"/>
    <text x="553" y="815" text-anchor="middle" font-size="13">Table on stdout, or the Markdown report</text>
    <path fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)" d="M 310.0 736 C 310.0 760.5, 184 760.5, 184 785"/>
    <path fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)" d="M 450.0 736 C 450.0 760.5, 553 760.5, 553 785"/>
    <text x="246" y="758" text-anchor="end" font-size="11.5" fill="#4c535c">Left</text>
    <text x="490" y="758" text-anchor="start" font-size="11.5" fill="#4c535c">Right</text>
  </g>
</svg>
