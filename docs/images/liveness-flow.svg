<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 900" width="860" height="900" role="img" aria-label="How liveness-check computes the status">
  <title>How liveness-check computes the status</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="900" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">
    <text x="22" y="30" text-anchor="start" font-size="16" font-weight="600">How liveness-check computes the status</text>
    <text x="22" y="50" text-anchor="start" font-size="12.5" fill="#57606a">Flag checks, 27 probes in parallel, a rollup per operation, and the overall verdict</text>
    <rect x="222" y="72" width="260" height="40" rx="20" fill="#0969da"/>
    <text x="352.0" y="97.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#ffffff">graphql-client liveness-check</text>
    <path fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)" d="M 352 112 L 352 136"/>
    <rect x="177" y="138" width="350" height="56" rx="7" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.3"/>
    <text x="352.0" y="162.5" text-anchor="middle" font-size="13">Endpoint is not empty and</text>
    <text x="352.0" y="179.5" text-anchor="middle" font-size="13">timeout is more than zero?</text>
    <path fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)" d="M 527 166 L 651 166"/>
    <text x="589" y="158" text-anchor="middle" font-size="11.5" fill="#4c535c">no</text>
    <rect x="654" y="142" width="184" height="48" rx="7" fill="#fff1f0" stroke="#e5534b" stroke-width="1.3"/>
    <text x="746.0" y="162.5" text-anchor="middle" font-size="12">Message on stderr</text>
    <text x="746.0" y="179.5" text-anchor="middle" font-size="12">exit status 1</text>
    <path fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)" d="M 352 194 L 352 223"/>
    <text x="361" y="214" text-anchor="start" font-size="11.5" fill="#4c535c">yes</text>
    <rect x="177" y="226" width="350" height="48" rx="7" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/>
    <text x="352.0" y="246.5" text-anchor="middle" font-size="13">Build the 27 probes</text>
    <text x="352.0" y="263.5" text-anchor="middle" font-size="13">and the 9 operation specs</text>
    <path fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)" d="M 352 274 L 352 301"/>
    <rect x="122" y="304" width="460" height="66" rx="7" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/>
    <text x="352.0" y="325.0" text-anchor="middle" font-size="13">Run every probe in parallel</text>
    <text x="352.0" y="342.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#0a3069">IOE.TraverseArray</text>
    <text x="352.0" y="359.0" text-anchor="middle" font-size="12">each probe gets its own --timeout context</text>
    <path fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)" d="M 352 370 L 352 397"/>
    <rect x="152" y="400" width="400" height="56" rx="7" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.3"/>
    <text x="352.0" y="424.5" text-anchor="middle" font-size="13">Payload is not empty and</text>
    <text x="352.0" y="441.5" text-anchor="middle" font-size="13">the root field is not null?</text>
    <rect x="96" y="500" width="190" height="48" rx="7" fill="#e9f7ec" stroke="#2da44e" stroke-width="1.4"/>
    <text x="191.0" y="520.5" text-anchor="middle" font-size="13.5" font-weight="600">Probe PASS</text>
    <text x="191.0" y="537.5" text-anchor="middle" font-size="12">keep the latency</text>
    <rect x="420" y="500" width="240" height="48" rx="7" fill="#fff1f0" stroke="#e5534b" stroke-width="1.3"/>
    <text x="540.0" y="520.5" text-anchor="middle" font-size="13.5" font-weight="600">Probe FAIL</text>
    <text x="540.0" y="537.5" text-anchor="middle" font-size="12">keep the first error message</text>
    <path fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)" d="M 262 456 C 262 476.5, 191 476.5, 191 497"/>
    <text x="196" y="480" text-anchor="end" font-size="11.5" fill="#4c535c">yes</text>
    <path fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)" d="M 442 456 C 442 476.5, 540 476.5, 540 497"/>
    <text x="560" y="480" text-anchor="start" font-size="11.5" fill="#4c535c">no, GraphQL error, or timeout</text>
    <rect x="122" y="580" width="460" height="48" rx="7" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/>
    <text x="352.0" y="600.5" text-anchor="middle" font-size="12">Group the outcomes by operation, count pass and fail,</text>
    <text x="352.0" y="617.5" text-anchor="middle" font-size="12">average the latency, set PASS when 0 probes fail</text>
    <path fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)" d="M 191 548 C 191 562.5, 232 562.5, 232 577"/>
    <path fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)" d="M 540 548 C 540 562.5, 472 562.5, 472 577"/>
    <path fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)" d="M 352 628 L 352 653"/>
    <rect x="192" y="656" width="320" height="34" rx="7" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.3"/>
    <text x="352.0" y="678.0" text-anchor="middle" font-size="13">Count the pass and fail outcomes</text>
    <rect x="89" y="726" width="150" height="38" rx="7" fill="#e9f7ec" stroke="#2da44e" stroke-width="1.4"/>
    <text x="164.0" y="750.0" text-anchor="middle" font-size="13.5" font-weight="600">HEALTHY</text>
    <rect x="277" y="726" width="150" height="38" rx="7" fill="#fff1e5" stroke="#e16f24" stroke-width="1.4"/>
    <text x="352.0" y="750.0" text-anchor="middle" font-size="13.5" font-weight="600">DEGRADED</text>
    <rect x="465" y="726" width="150" height="38" rx="7" fill="#fff1f0" stroke="#e5534b" stroke-width="1.3"/>
    <text x="540.0" y="750.0" text-anchor="middle" font-size="13.5" font-weight="600">DOWN</text>
    <path fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)" d="M 272 690 C 272 706.5, 164 706.5, 164 723"/>
    <text x="150" y="712" text-anchor="end" font-size="11.5" fill="#4c535c">0 failed</text>
    <path fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)" d="M 352 690 L 352 723"/>
    <text x="361" y="712" text-anchor="start" font-size="11.5" fill="#4c535c">mixed</text>
    <path fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)" d="M 432 690 C 432 706.5, 540 706.5, 540 723"/>
    <text x="554" y="712" text-anchor="start" font-size="11.5" fill="#4c535c">0 passed</text>
    <rect x="192" y="812" width="320" height="62" rx="7" fill="#f2fbf5" stroke="#4ac26b" stroke-width="1.3"/>
    <text x="352.0" y="831.0" text-anchor="middle" font-size="12">Write the Markdown report</text>
    <text x="352.0" y="848.0" text-anchor="middle" font-size="12">print the path on stdout</text>
    <text x="352.0" y="865.0" text-anchor="middle" font-size="12">exit status 0</text>
    <path fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)" d="M 164 764 C 164 786.5, 257 786.5, 257 809"/>
    <path fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)" d="M 352 764 L 352 809"/>
    <path fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)" d="M 540 764 C 540 786.5, 447 786.5, 447 809"/>
  </g>
</svg>
